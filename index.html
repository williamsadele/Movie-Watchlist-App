<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
    <div class="header-top">
        <span class="reel">🎬</span>
        <h1>Vwooth's Watchlist</h1>
    </div>
    <p class="stats"></p>
    <div class="divider"></div>
</header>
<div class="add-section">
    <input type="text" id="input-el" placeholder="Type a movie title...">
    <button id="addbtn">+ Add</button>
</div>

<ul id="ul-el">

</ul>

<div class="footer">
    <button id="deletebtn">Clear All</button>
</div>

</div>
<script src="script.js" ></script>
</body>
</html>
